# ─────────────────────────────────────────
# Floral / vintage kitty
# ─────────────────────────────────────────

font_family Victor Mono
font_size 12

shell /usr/bin/fish

# Completely borderless
hide_window_decorations yes

# Wallpaper
background #eee7d5
foreground #51483d

background_image ~/.config/kitty/floral-paper.jpg
background_image_layout cscaled
background_image_linear yes
background_tint 0.12

# The terminal itself should be opaque
background_opacity 1.0

# No visible frame around the terminal
window_padding_width 0
window_margin_width 0

# Cursor
cursor #51483d
cursor_text_color #eee7d5
cursor_shape block
cursor_blink_interval 0

# Selection
selection_foreground #eee7d5
selection_background #776b5b

# Vintage ANSI colors
color0  #000000
color1  #000000
color2  #000000
color3  #000000
color4  #000000
color5  #000000
color6  #000000
color7  #000000

color8  #766c5e
color9  #b87868
color10 #000000
color11 #000000
color12 #000000
color13 #000000
color14 #000000
color15 #000000

enable_audio_bell no
scrollback_lines 10000
